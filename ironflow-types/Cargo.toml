[package]
name = "ironflow-types"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Shared API envelope types for the Ironflow ecosystem"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "api", "types", "ironflow"]
categories = ["data-structures"]

[features]
default = []
openapi = ["utoipa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", optional = true }

[dev-dependencies]
serde_json = "1"
