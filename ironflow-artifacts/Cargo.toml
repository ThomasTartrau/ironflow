[package]
name = "ironflow-artifacts"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Blob storage abstraction for ironflow workflow artifacts"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "artifacts", "storage", "ironflow"]
categories = ["asynchronous", "filesystem"]

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x"], optional = true }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

[features]
default = ["artifact-local"]
artifact-local = []
storage-s3 = ["aws-sdk-s3", "aws-config", "aws-credential-types", "aws-smithy-types"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
