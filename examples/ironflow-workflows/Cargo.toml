[package]
name = "ironflow-workflows"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example workflow handlers for ironflow"

[dependencies]
ironflow-engine = { path = "../../ironflow-engine" }
ironflow-store = { path = "../../ironflow-store" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ironflow-core = { path = "../../ironflow-core" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
