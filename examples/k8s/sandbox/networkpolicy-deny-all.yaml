# Default deny for agent pods: no ingress at all, and egress only to the
# cluster DNS. Works with any CNI enforcing standard NetworkPolicy.
#
# Standard NetworkPolicy cannot allow a host name, only IP ranges: pair it
# with cilium-egress-anthropic.yaml (or your CNI's FQDN policy) to let the
# agent reach api.anthropic.com.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claude-runner-deny-all
  namespace: ironflow-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: claude-runner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
