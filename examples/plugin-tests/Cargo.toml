[package]
name = "ironflow-plugin-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
doctest = true

[dependencies]
ironflow-core = { path = "../../ironflow-core", features = [
    "provider-anthropic-api",
    "provider-openai",
    "tool-bash",
    "tool-read-file",
    "tool-web-fetch",
] }
ironflow-engine = { path = "../../ironflow-engine", features = ["secret-store"] }
ironflow-store = { path = "../../ironflow-store", features = [
    "store-postgres",
    "secret-store",
] }

chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
