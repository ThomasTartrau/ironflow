[package]
name = "ironflow-example-server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ironflow-server"
path = "src/main.rs"

[dependencies]
ironflow-core = { path = "../../ironflow-core" }
ironflow-store = { path = "../../ironflow-store", features = ["store-memory", "secret-store"] }
ironflow-engine = { path = "../../ironflow-engine" }
ironflow-artifacts = { path = "../../ironflow-artifacts" }
ironflow-api = { path = "../../ironflow-api", features = ["dashboard", "sign-up", "openapi"] }
ironflow-auth = { path = "../../ironflow-auth" }
ironflow-workflows = { path = "../ironflow-workflows" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
