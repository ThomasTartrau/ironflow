[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ironflow-store = { path = "../ironflow-store", features = ["store-memory", "secret-store"] }
ironflow-auth = { path = "../ironflow-auth" }
ironflow-artifacts = { path = "../ironflow-artifacts" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
serde_json = "1"
rust_decimal = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
postgres = ["ironflow-store/store-postgres", "dep:sqlx"]

[dependencies.sqlx]
version = "0.8"
features = ["postgres", "runtime-tokio-rustls"]
optional = true
