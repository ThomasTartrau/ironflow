# Ignored advisories for transitive dependencies with no fix available.

[advisories]
ignore = [
    # rsa 0.9 (via jsonwebtoken) and rsa 0.10.0-rc (via russh, transport-ssh)
    # Marvin Attack timing sidechannel. No fixed version available.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5 (via elliptic-curve 0.13 / aws-sigv4) -- timing variability
    # The fix is only in >=0.7.6, no 0.5.x backport. Remove this entry once
    # aws-sigv4 moves off elliptic-curve 0.13.
    "RUSTSEC-2026-0387",

    # unsafe-libyaml 0.2 (via serde_yaml, via progenitor-macro) -- unmaintained
    # Build-time proc-macro of ironflow-sdk only, never linked into a binary.
    # progenitor-macro still depends on serde_yaml in 0.15; remove once it moves off it.
    "RUSTSEC-2024-0449",

    # libsqlite3-sys 0.30 (via sqlx-sqlite) -- bundled C SQLite CVE
    # Locked only because sqlx 0.8 names sqlx-sqlite in weak features: no crate enables
    # sqlite, and `cargo tree -i libsqlite3-sys --all-features --target all` is empty.
    # The fix needs sqlx 0.9; remove this entry with that migration.
    "RUSTSEC-2026-0459",

    # kube-client 5.0 -- `openssl-tls` trusts OpenSSL's default CA store
    # Only the `openssl-tls` feature is affected: ops/k8s enables `rustls-tls`, and
    # `cargo tree -e features -i kube-client --all-features --target all` has no openssl-tls.
    # The fix is kube 5.2, which needs rustc 1.95; remove once the CI image moves to it.
    "RUSTSEC-2026-0600",
]
