# Ignored advisories for transitive dependencies with no fix available.
# These come from `russh` (transport-ssh feature) and have no upstream fix yet.

[advisories]
ignore = [
    # libcrux-sha3 0.0.4 (via russh -> libcrux-ml-kem)
    # No fixed version available
    "RUSTSEC-2026-0074",

    # rsa 0.10.0-rc.12 (via russh) -- Marvin Attack timing sidechannel
    # No fixed version available
    "RUSTSEC-2023-0071",

    # proc-macro-error2 2.0.1 (via validator_derive) -- unmaintained
    # validator 0.20 is the latest version, no alternative available
    "RUSTSEC-2026-0173",

    # rkyv 0.7.46 (optional dep of rust_decimal, never compiled)
    # rust_decimal's rkyv feature is not enabled; present in lockfile only
    "RUSTSEC-2026-0235",

    # crypto-bigint 0.5.5 (via elliptic-curve 0.13 / aws-sigv4) -- timing variability
    # The fix is only in >=0.7.6, no 0.5.x backport; 0.7.5 is pulled by RustCrypto
    # release candidates and should be bumped with `cargo update -p crypto-bigint`
    # once the dependents allow it. Remove this entry then.
    "RUSTSEC-2026-0387",
]
