[package]
name = "ironflow-templates"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Template system for the Ironflow workflow engine -- fetch, discover and install workflow templates from Git repositories"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "templates", "ironflow", "shadcn"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
