schema_version: "1.1"
name: pr-summary
description: Command injection - the free-text output of an agent step is formatted into ShellConfig::new.
expected_outcome: blocker at pr_summary.rs:57-64, no other blocker or bug.
tags: [review, injection, "phrasing:slash"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    /ironflow review src/pr_summary.rs
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:pr_summary\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)(?:5[7-9]|6[0-4])\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)blocker[*_]*\s+\S*pr_summary\.rs:(?:5[7-9]|6[0-4])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!(?:5[7-9]|6[0-4])\b)\d+'
