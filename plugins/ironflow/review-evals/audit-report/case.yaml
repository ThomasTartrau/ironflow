schema_version: "1.1"
name: audit-report
description: Clean handler - stdout parsed into a typed struct, when_dynamic, side effects before the gate wrapped in ctx.http.
expected_outcome: no blocker or bug, a concluding findings line.
tags: [review, clean, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Relis mon handler `audit-report` avant que je le merge : `src/audit_report.rs`. Je veux le rapport, ne modifie rien.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: concluded
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:no|aucun[e]?|\d+)\s+(?:findings?|constats?|problèmes?|issues?|anomalies?|blockers?)\b|found nothing|nothing to (?:report|flag)|rien (?:à signaler|trouvé)'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:\d+'
