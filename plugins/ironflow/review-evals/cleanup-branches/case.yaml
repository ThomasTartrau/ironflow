schema_version: "1.1"
name: cleanup-branches
description: Missing registration - CleanupBranches is declared and re-exported but absent from handlers().
expected_outcome: bug or blocker at lib.rs (handlers) or cleanup_branches.rs:6-8, no other blocker or bug.
tags: [review, registration, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Relis le nouveau workflow `cleanup-branches` avant merge : `src/cleanup_branches.rs`. Rapport uniquement, ne modifie rien.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:lib\.rs:(?:[48]|1[3-6])|cleanup_branches\.rs:[68])\b|(?:CleanupBranches|cleanup-branches)[^\n]{0,120}(?:handlers\(\)|regist|enregistr)|(?:handlers\(\)|regist|enregistr)[^\n]{0,120}(?:CleanupBranches|cleanup-branches)'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*(?:lib\.rs:(?:[48]|1[3-6])|cleanup_branches\.rs:[68])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*(?:(?:backup_db|hello)\.rs:\d+|cleanup_branches\.rs:(?![68]\b)\d+|lib\.rs:(?!(?:[48]|1[3-6])\b)\d+)'
