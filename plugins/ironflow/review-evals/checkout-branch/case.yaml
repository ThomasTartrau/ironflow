schema_version: "1.1"
name: checkout-branch
description: Command injection - the branch name from the run input is formatted into ShellConfig::new.
expected_outcome: blocker at checkout_branch.rs:35-41, no other blocker or bug.
tags: [review, injection, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Relis le handler `checkout-branch` avant que je le merge : il est dans `src/checkout_branch.rs`. Donne-moi juste le rapport, ne modifie rien.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:checkout_branch\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)(?:3[5-9]|4[01])\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)blocker[*_]*\s+\S*checkout_branch\.rs:(?:3[5-9]|4[01])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!(?:3[5-9]|4[01])\b)\d+'
