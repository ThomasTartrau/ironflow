schema_version: "1.1"
name: publish-crate
description: Secret leak - the crates.io token is formatted into the persisted shell command line.
expected_outcome: blocker at publish_crate.rs:38-41, no other blocker or bug.
tags: [review, secret, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    J'ai écrit le workflow `publish-crate` (`src/publish_crate.rs`). Relis-le avant merge et donne-moi le rapport, sans rien modifier.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:publish_crate\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)(?:3[89]|4[01])\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)blocker[*_]*\s+\S*publish_crate\.rs:(?:3[89]|4[01])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!(?:3[89]|4[01])\b)\d+'
