schema_version: "1.1"
name: build-matrix
description: Unstable step name - package-{stamp} is built from Utc::now(), so the cache misses on replay.
expected_outcome: bug or blocker at build_matrix.rs:25-28, no other blocker or bug.
tags: [review, step-name, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Avant de merger, fais une review du handler `build-matrix` (`src/build_matrix.rs`). Rapport seulement, ne touche à rien.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:build_matrix\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)2[5-8]\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*build_matrix\.rs:2[5-8]\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!2[5-8]\b)\d+'
