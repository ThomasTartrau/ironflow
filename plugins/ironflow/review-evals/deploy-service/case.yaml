schema_version: "1.1"
name: deploy-service
description: Clean handler - input through .env and exec, announcement in ctx.http before the gate, typed ctx.when, secret through .env.
expected_outcome: no blocker or bug, a concluding findings line.
tags: [review, clean, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Relis le handler `deploy-service` avant merge : `src/deploy_service.rs`. Donne-moi juste le rapport, ne modifie rien.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: concluded
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:no|aucun[e]?|\d+)\s+(?:findings?|constats?|problèmes?|issues?|anomalies?|blockers?)\b|found nothing|nothing to (?:report|flag)|rien (?:à signaler|trouvé)'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:\d+'
