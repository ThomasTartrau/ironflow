schema_version: "1.1"
name: notify-deploy
description: Side effect outside a step - a reqwest POST before ctx.approval runs again on replay.
expected_outcome: blocker or bug at notify_deploy.rs:37-43, no other blocker or bug.
tags: [review, side-effect, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Tu peux relire mon workflow `notify-deploy` ? Le fichier est `src/notify_deploy.rs`. Je veux le rapport de review, sans modification.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:notify_deploy\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)(?:3[7-9]|4[0-3])\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*notify_deploy\.rs:(?:3[7-9]|4[0-3])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!(?:3[7-9]|4[0-3])\b)\d+'
