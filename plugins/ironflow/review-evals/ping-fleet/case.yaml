schema_version: "1.1"
name: ping-fleet
description: Clean handler - loop steps named ping-{i} and drain-{i}, pure computation before the gate, exec arguments.
expected_outcome: no blocker or bug, a concluding findings line.
tags: [review, clean, "phrasing:natural"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Tu peux faire une review du workflow `ping-fleet` ? C'est `src/ping_fleet.rs`. Rapport seulement, sans modification.
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: concluded
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:no|aucun[e]?|\d+)\s+(?:findings?|constats?|problèmes?|issues?|anomalies?|blockers?)\b|found nothing|nothing to (?:report|flag)|rien (?:à signaler|trouvé)'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:\d+'
