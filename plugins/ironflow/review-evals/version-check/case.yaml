schema_version: "1.1"
name: version-check
description: Stringly-typed access - the HTTP body is read as output["body"]["version"] with unwrap_or_default.
expected_outcome: bug or blocker at version_check.rs:26-28, no other blocker or bug.
tags: [review, stringly, "phrasing:slash"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    /ironflow review src/version_check.rs
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:version_check\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)2[6-8]\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*version_check\.rs:2[6-8]\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!2[6-8]\b)\d+'
