schema_version: "1.1"
name: nightly-report
description: Side effect outside a step - a CSV line appended to a local file before ctx.approval is written again on replay.
expected_outcome: blocker or bug at nightly_report.rs:28-34, no other blocker or bug.
tags: [review, side-effect, "phrasing:slash"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    /ironflow review src/nightly_report.rs
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: 'workflow-reviewer'
  - name: located
    type: regex
    weight: 2
    flags: i
    pattern: '(?:nightly_report\.rs:|\b(?:lines?|lignes?|l\.|L)\s*)(?:2[89]|3[0-4])\b'
  - name: severity
    type: regex
    target: trace
    flags: i
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*nightly_report\.rs:(?:2[89]|3[0-4])\b'
  - name: no-false-alarm
    type: regex
    target: trace
    flags: i
    match: not_contains
    pattern: '(?:\\n|\b)(?:blocker|bug)[*_]*\s+\S*\.rs:(?!(?:2[89]|3[0-4])\b)\d+'
