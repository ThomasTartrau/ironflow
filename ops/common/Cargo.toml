[package]
name = "ironflow-ops-common"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Shared HTTP client, helpers and test utilities for Ironflow ops crates"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "http", "operations", "ironflow"]
categories = ["asynchronous", "development-tools"]

[features]
test-utils = []

[dependencies]
async-trait = "0.1"
ironflow-core = { version = "3.15.1", path = "../../ironflow-core" }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ironflow-ops-common = { path = ".", features = ["test-utils"] }
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
