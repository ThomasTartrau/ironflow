[package]
name = "ironflow-ops-postgres"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "PostgreSQL operations for Ironflow workflows, powered by sqlx"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "postgres", "operations", "ironflow"]
categories = ["asynchronous", "database"]

[dependencies]
async-trait = "0.1"
ironflow-core = { version = "3.15.0", path = "../../ironflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
