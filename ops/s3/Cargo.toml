[package]
name = "ironflow-ops-s3"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "AWS S3 operations for Ironflow workflows, powered by the aws-sdk-s3 crate"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "s3", "aws", "operations", "ironflow"]
categories = ["asynchronous", "development-tools"]

[dependencies]
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
aws-smithy-types = "1"
ironflow-core = { version = "3.15.0", path = "../../ironflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
