[package]
name = "ironflow-ops-helm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Helm operations for Ironflow workflows, wrapping the Helm CLI"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "helm", "kubernetes", "operations", "ironflow"]
categories = ["asynchronous", "development-tools"]

[dependencies]
async-trait = "0.1"
ironflow-core = { version = "3.15.0", path = "../../ironflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
