[package]
name = "ironflow-ops-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Git operations for Ironflow workflows, powered by git2"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "git", "operations", "ironflow"]
categories = ["asynchronous", "development-tools"]

[dependencies]
async-trait = "0.1"
git2 = "0.20"
ironflow-core = { version = "3.15.0", path = "../../ironflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
