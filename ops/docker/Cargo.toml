[package]
name = "ironflow-ops-docker"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Docker operations for Ironflow workflows, powered by bollard"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "docker", "operations", "ironflow"]
categories = ["asynchronous", "development-tools"]

[dependencies]
async-trait = "0.1"
bollard = "0.20"
ironflow-core = { version = "3.15.0", path = "../../ironflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
