[package]
name = "ironflow-worker"
version = "2.13.2"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "HTTP-based background worker for ironflow — polls the API and executes workflows"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "worker", "queue", "background"]
categories = ["asynchronous"]

[dependencies]
ironflow-core = { version = "3.6.0", path = "../ironflow-core" }
ironflow-store = { version = "2.21.1", path = "../ironflow-store", default-features = false }
ironflow-engine = { version = "2.23.1", path = "../ironflow-engine" }
ironflow-artifacts = { version = "0.1.1", path = "../ironflow-artifacts" }

bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metrics = { version = "0.24", optional = true }

[features]
default = []
prometheus = ["metrics", "ironflow-engine/prometheus"]
opentelemetry = ["ironflow-engine/opentelemetry"]
heartbeat = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rust_decimal = "1"
