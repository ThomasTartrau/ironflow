stages:
  - check
  - test
  - build
  - release
  - publish

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

.rust-cache: &rust-cache
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

cargo-fmt:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

cargo-clippy:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --exclude ironflow-example-server -- -D warnings
    - cargo clippy --workspace --all-targets --exclude ironflow-example-server --features prometheus -- -D warnings

cargo-check:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo check --workspace --all-targets --exclude ironflow-example-server

dashboard-lint:
  stage: check
  image: node:22
  cache:
    key: dashboard-${CI_COMMIT_REF_SLUG}
    paths:
      - ironflow-dashboard/node_modules/
  script:
    - cd ironflow-dashboard && npm install --legacy-peer-deps
    - npm run lint

dashboard-typecheck:
  stage: check
  image: node:22
  cache:
    key: dashboard-${CI_COMMIT_REF_SLUG}
    paths:
      - ironflow-dashboard/node_modules/
  script:
    - cd ironflow-dashboard && npm install --legacy-peer-deps
    - npx tsc -b --noEmit

dashboard-build:
  stage: build
  image: node:22
  needs:
    - dashboard-lint
    - dashboard-typecheck
  cache:
    key: dashboard-${CI_COMMIT_REF_SLUG}
    paths:
      - ironflow-dashboard/node_modules/
  script:
    - cd ironflow-dashboard && npm install --legacy-peer-deps && npm run build
  artifacts:
    paths:
      - ironflow-dashboard/dist/
    expire_in: 1 hour

cargo-check-dashboard:
  stage: build
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - dashboard-build
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - ls ironflow-dashboard/dist/
    - mkdir -p ironflow-api/dashboard
    - cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
    - ls ironflow-api/dashboard/
    - cargo check -p ironflow-api --features dashboard
    - cargo check -p ironflow-example-server

cargo-audit:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  script:
    - cargo install cargo-audit --locked
    - cargo audit
  allow_failure: false

unit-tests:
  stage: test
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - cargo-check
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server

test-prometheus:
  stage: test
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - cargo-check
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server --features prometheus

doc-tests:
  stage: test
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - cargo-check
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server --doc

build-debug:
  stage: build
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - unit-tests
    - test-prometheus
    - doc-tests
  script:
    - cargo build --workspace --exclude ironflow-example-server

build-release:
  stage: build
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - unit-tests
    - test-prometheus
    - doc-tests
  script:
    - cargo build --workspace --exclude ironflow-example-server --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: node:22
  needs:
    - build-release
    - cargo-audit
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential cmake curl
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0 --no-modify-path
    - ln -sf "${CARGO_HOME}/bin/cargo" /usr/local/bin/cargo
    - ln -sf "${CARGO_HOME}/bin/rustc" /usr/local/bin/rustc
  script:
    - export PATH="${CARGO_HOME}/bin:$PATH"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git checkout -B "$CI_COMMIT_BRANCH"
    - npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec @semantic-release/gitlab conventional-changelog-conventionalcommits
    - npx semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Publish jobs (triggered by release tag) ---

.publish-crate: &publish-crate
  stage: publish
  image: rust:1.94.0
  <<: *rust-cache
  script:
    - cargo publish -p ${CRATE_NAME} --allow-dirty
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  retry:
    max: 2
    when: script_failure

publish-core:
  <<: *publish-crate
  variables:
    CRATE_NAME: ironflow-core

publish-store:
  <<: *publish-crate
  needs:
    - publish-core
  variables:
    CRATE_NAME: ironflow-store

publish-auth:
  <<: *publish-crate
  needs:
    - publish-core
  variables:
    CRATE_NAME: ironflow-auth

publish-engine:
  <<: *publish-crate
  needs:
    - publish-store
  variables:
    CRATE_NAME: ironflow-engine

publish-api:
  <<: *publish-crate
  needs:
    - publish-engine
    - publish-auth
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm
    - cd ironflow-dashboard && npm install --legacy-peer-deps && npm run build
    - cd .. && mkdir -p ironflow-api/dashboard && cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
  variables:
    CRATE_NAME: ironflow-api

publish-worker:
  <<: *publish-crate
  needs:
    - publish-engine
  variables:
    CRATE_NAME: ironflow-worker

publish-runtime:
  <<: *publish-crate
  needs:
    - publish-core
  variables:
    CRATE_NAME: ironflow-runtime
