workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore: release/'
      variables:
        RELEASE_COMMIT: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - build
  - release
  - deploy

# Infrastructure-only retries. The runner reaches Docker Hub over a link that
# times out often enough to redden pipelines on an image pull, before a single
# line of the job script runs. Only the reasons GitLab attributes to the runner
# or the platform are listed here: a script_failure -- a real clippy error, a
# failing test, a vulnerability found by cargo audit -- still fails on the first
# attempt.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  IRONFLOW_FEATURES: "prometheus,openapi,sign-up,transport-docker,transport-k8s,transport-ssh,secret-store"
  GIT_DEPTH: 50
  GIT_STRATEGY: fetch
  FF_USE_FASTZIP: 1
  CACHE_COMPRESSION_LEVEL: "fastest"
  RELEASE_PLZ_VERSION: "0.3.160"
  CI_RUST_IMAGE_TAG: "1.94.1-v3"
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_NET_RETRY: "5"
  COREPACK_HOME: "${CI_PROJECT_DIR}/.corepack"
  # Compiled crates are shared between jobs, branches and projects through the
  # sccache bucket of the homelab MinIO (homelab-cluster#24), so target/ stays
  # out of the GitLab cache. Incremental compilation is off: sccache cannot
  # cache an incremental crate. The credentials are mapped by .sccache.
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://minio.ci.svc.cluster.local:9000
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "false"
  SCCACHE_S3_KEY_PREFIX: ironflow
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

# Starts the sccache server of a Rust job. When it cannot start -- credentials
# missing, MinIO unreachable (SaaS runner), bucket absent -- the job compiles
# without a cache instead of failing. The masked SCCACHE_AWS_* variables are
# mapped here rather than as global AWS_* variables, so only the Rust jobs
# receive them. A job of the ci-rust image that compiles, or runs `cargo
# metadata` without --no-deps, must extend .sccache: cargo runs `rustc -vV`
# through the global wrapper, and an sccache server that cannot start fails
# the job, SCCACHE_IGNORE_SERVER_IO_ERROR or not.
.sccache-start: &sccache-start
  - export AWS_ACCESS_KEY_ID="${SCCACHE_AWS_ACCESS_KEY_ID:-}" AWS_SECRET_ACCESS_KEY="${SCCACHE_AWS_SECRET_ACCESS_KEY:-}"
  - |
    if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
      echo "sccache: SCCACHE_AWS_* credentials missing, compiling without cache."
      unset RUSTC_WRAPPER
    elif ! sccache --start-server; then
      echo "sccache: server did not start against ${SCCACHE_ENDPOINT}, compiling without cache."
      unset RUSTC_WRAPPER
    fi

.sccache:
  before_script: *sccache-start
  after_script:
    - sccache --show-stats || true

.rust-debug-cache: &rust-debug-cache
  cache:
    key: rust-debug-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-debug-${CI_DEFAULT_BRANCH}
      - rust-release-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/

.rust-release-cache: &rust-release-cache
  cache:
    key: rust-release-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-release-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/

.dashboard-cache: &dashboard-cache
  cache:
    key: dashboard-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - dashboard-${CI_DEFAULT_BRANCH}
    paths:
      - ironflow-dashboard/node_modules/
      - .corepack/

# Kaniko builds the image for the runner's own platform. The homelab runner and
# every cluster node are amd64, so this publishes a linux/amd64 image -- which is
# what fixes the "exec format error": the previous tag was an arm64-only image
# built on a Mac. On main, the job rebuilds when either the Dockerfile OR the tag
# (CI_RUST_IMAGE_TAG, defined in this file) changes, so bumping the tag is enough
# to republish the image. The manual rule is a fallback to republish on demand.
build-ci-images:
  stage: .pre
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: 1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ci/rust/Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/ci/rust"
      --dockerfile "${CI_PROJECT_DIR}/ci/rust/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}"
      --cache=true

# Official sandboxed Claude Code runner image (docker/claude-runner), published
# as ironflow-claude-runner:<IMAGE_TAG>, never as `latest`. The tag lives in
# docker/claude-runner/IMAGE_TAG (<claude-code-version>-<n>), not in this file,
# so a version bump is a change to the image sources and triggers the build.
# The Claude Code version is the tag without its -<n> revision. A file the
# Dockerfile COPYs must be added to the `changes` lists of both jobs.
.claude-runner-image:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: 1
  before_script:
    - RUNNER_IMAGE_TAG="$(cat docker/claude-runner/IMAGE_TAG)"
    - RUNNER_CLAUDE_CODE_VERSION="${RUNNER_IMAGE_TAG%-*}"
    - |
      if ! echo "${RUNNER_IMAGE_TAG}" | grep -Eq '^.+-[0-9]+$'; then
        echo "docker/claude-runner/IMAGE_TAG must read <claude-code-version>-<n>, got '${RUNNER_IMAGE_TAG}'"
        exit 1
      fi

# MR check, only when the image changes. Builds without pushing, so a broken
# Dockerfile or a Claude Code version missing from npm fails before merge. A
# Dockerfile change without a new IMAGE_TAG fails too: main would overwrite a
# published tag with different content.
check-claude-runner-image:
  extends: .claude-runner-image
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/claude-runner/IMAGE_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/claude-runner/Dockerfile
      variables:
        RUNNER_IMAGE_TAG_UNCHANGED: "true"
  script:
    - |
      if [ "${RUNNER_IMAGE_TAG_UNCHANGED}" = "true" ]; then
        echo "docker/claude-runner/Dockerfile changed but docker/claude-runner/IMAGE_TAG did not."
        echo "Bump its -<n> revision, or main overwrites the published ${RUNNER_IMAGE_TAG}."
        exit 1
      fi
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/docker/claude-runner"
      --dockerfile "${CI_PROJECT_DIR}/docker/claude-runner/Dockerfile"
      --build-arg "CLAUDE_CODE_VERSION=${RUNNER_CLAUDE_CODE_VERSION}"
      --no-push

# MR check: the Claude Code version of the runner image must know every full
# model id of `Model` (ironflow-core), or the API refuses the model with a 400
# claude_code_version_too_old. Runs when either side changes.
check-runner-models:
  stage: check
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ironflow-core/src/operations/agent.rs
        - docker/claude-runner/IMAGE_TAG
        - scripts/check-runner-models.sh
  script:
    - scripts/check-runner-models.sh

# On main, publishes the image when the Dockerfile or IMAGE_TAG changes. The
# manual rule is a fallback to republish on demand.
build-claude-runner-image:
  extends: .claude-runner-image
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/claude-runner/Dockerfile
        - docker/claude-runner/IMAGE_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/docker/claude-runner"
      --dockerfile "${CI_PROJECT_DIR}/docker/claude-runner/Dockerfile"
      --build-arg "CLAUDE_CODE_VERSION=${RUNNER_CLAUDE_CODE_VERSION}"
      --destination "${CI_REGISTRY_IMAGE}/ironflow-claude-runner:${RUNNER_IMAGE_TAG}"
      --cache=true

# ironflow-auth-proxy image (docker/auth-proxy), published as
# ironflow-auth-proxy:<version>, never as `latest`. <version> is the version of
# the ironflow-auth-proxy crate: a Dockerfile change ships with the next release
# of the crate, never under a tag already published. The build context is the
# repository root, trimmed by .dockerignore, and the Rust version is the one of
# CI_RUST_IMAGE_TAG. A path the image compiles from must be added to the
# `changes` list of check-auth-proxy-image.
.auth-proxy-image:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_DEPTH: 1
  before_script:
    - AUTH_PROXY_RUST_VERSION="${CI_RUST_IMAGE_TAG%-*}"

# MR check, only when the image or what it compiles changes. Builds without
# pushing. Release MRs only bump versions: skipped, as by .only-mr.
check-auth-proxy-image:
  extends: .auth-proxy-image
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/auth-proxy/**/*
        - ironflow-auth-proxy/**/*
        - ironflow-core/src/auth_proxy/**/*
        - Cargo.lock
        - .dockerignore
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/auth-proxy/Dockerfile"
      --build-arg "RUST_VERSION=${AUTH_PROXY_RUST_VERSION}"
      --no-push

# release-plz is installed as a prebuilt musl binary, not built from source:
# its dependency tree (cargo crate) tracks the latest rustc and breaks on the
# pinned toolchain image. The binary is self-contained and toolchain-independent.
.install-release-plz: &install-release-plz
  - mkdir -p "${CI_PROJECT_DIR}/.cargo/bin"
  - curl -sSfL "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "${CI_PROJECT_DIR}/.cargo/bin" release-plz
  - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  - release-plz --version

.pnpm-install-script: &pnpm-install-script
  - corepack enable
  - cd ironflow-dashboard
  # The runner reaches registry.npmjs.org through a 10s connect timeout that
  # fires often enough to redden pipelines. Retry the download instead of
  # failing the job on the first miss; a warm COREPACK_HOME skips it entirely.
  - for attempt in 1 2 3; do corepack prepare --activate && break || sleep 10; done
  - pnpm install || { pnpm approve-builds msw && pnpm install --frozen-lockfile; }

.pnpm-install: &pnpm-install
  before_script: *pnpm-install-script

# Merges the MR's target branch into the checkout before the checks, so an MR
# pipeline validates the code as it will be once merged, not the branch tip
# alone. Two MRs green on their own shipped two migrations with the same version
# in ironflow-store 2.46.0 (#190). An MR behind main needs no rebase: rerunning
# its pipeline merges the current main. No-op outside an MR pipeline.
.merge-target-branch: &merge-target-branch
  - sh ci/merge-target-branch.sh

# Validation jobs run on MR pipelines, after merging the target branch.
# unit-tests and postgres-tests also run on main: an MR pipeline gone stale
# because main moved after it ran is caught there, before release-plz publishes.
# Release MRs from release-plz only bump Cargo.toml + CHANGELOG, no code changes --
# skip validation to save CI time (dashboard-build still runs to satisfy MWPS).
# A job's own before_script replaces the template's instead of extending it, so
# the jobs that need another setup step extend .only-mr-sccache or .only-mr-pnpm,
# which keep the merge first.
.only-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - *merge-target-branch

.only-mr-sccache:
  extends: [.only-mr, .sccache]
  before_script:
    - *merge-target-branch
    - *sccache-start

.only-mr-pnpm:
  extends: .only-mr
  before_script:
    - *merge-target-branch
    - *pnpm-install-script

# Rules of a validation job that also gates the publication on main.
.mr-and-main:
  rules:
    - !reference [.only-mr, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Black-box tests of ci/merge-target-branch.sh, when it changes.
merge-target-branch-tests:
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/merge-target-branch.sh
        - ci/tests/merge-target-branch.test.sh
  script:
    - sh ci/tests/merge-target-branch.test.sh

cargo-fmt:
  extends: .only-mr
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo fmt --all -- --check

cargo-clippy:
  extends: .only-mr-sccache
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo clippy --workspace --all-targets --exclude ironflow-example-server --features "$IRONFLOW_FEATURES" -- -D warnings

# ironflow-store bundles its own .sqlx cache so downstream consumers can build
# with SQLX_OFFLINE=true against the published crate. That cache lives in
# ironflow-store/.sqlx and is independent from the workspace-root .sqlx used
# when building ironflow-store as a workspace member -- `cargo check` from here
# silently falls back to the root cache and would miss a stale crate-local one.
# `cargo package` builds the crate in isolation (as crates.io would), so it's
# the only way to actually catch this drift before it ships.
sqlx-cache-check:
  extends: .only-mr-sccache
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  variables:
    SQLX_OFFLINE: "true"
  script:
    # ironflow-core is packaged alongside so ironflow-store is verified against the
    # workspace core, not the last release on crates.io.
    - cargo package -p ironflow-core -p ironflow-store --features ironflow-store/store-postgres,ironflow-store/secret-store,ironflow-store/openapi

dashboard-check:
  extends: .only-mr-pnpm
  stage: check
  image: node:22
  <<: *dashboard-cache
  script:
    - pnpm run lint
    - pnpm tsc -b --noEmit
    - pnpm test

cargo-audit:
  extends: .only-mr
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  script:
    - cargo audit
  allow_failure: false

mdbook-build:
  extends: .only-mr
  stage: check
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  script:
    - mdbook build

unit-tests:
  extends: [.only-mr-sccache, .mr-and-main]
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo nextest run --profile ci --workspace --exclude ironflow-example-server --features "$IRONFLOW_FEATURES"

doc-tests:
  extends: .only-mr-sccache
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server --features "$IRONFLOW_FEATURES" --doc

# The PostgreSQL suites: the `#[ignore]` tests that need a database. The
# in-memory store accepts whatever the Rust types allow, so migrations and the
# SQL state machines are only exercised here. Without this job, a migration that
# failed on every blank database reached main (#113). It also runs on main, before
# release-plz: two migrations with the same version, each green in its own MR,
# were published in 2.46.0 (#190).
# Durability is off: postgres_fsm creates databases and replays every migration,
# and with an fsync per commit on the runner's shared disk it hit its 60s timeout.
postgres-tests:
  extends: [.only-mr-sccache, .mr-and-main]
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs: []
  services:
    - name: postgres:17-alpine
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    RUSTFLAGS: "-D warnings"
    POSTGRES_DB: ironflow
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/ironflow"
  script:
    - scripts/test-postgres.sh

# The Claude Code plugin ships a project template (plugins/ironflow/skills/setup/assets).
# Scaffold it against this checkout and make sure it builds and its tests pass.
check-plugin-template:
  extends: .only-mr-sccache
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - scripts/check-plugin-template.sh

# Every Rust snippet of the Claude Code plugin skills is a doctest of examples/plugin-tests.
# plugins/ironflow has no Cargo.toml, so this crate is the way to compile them.
check-plugin-doctests:
  extends: .only-mr-sccache
  stage: test
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test -p ironflow-plugin-tests --doc

# Runs the eval suite of the Claude Code plugin (plugins/ironflow/evals) with
# `claude plugin eval`. Offered only when the plugin changes, started by hand and never
# blocking: every run spends Claude subscription usage, and model answers are not
# deterministic enough to gate a merge. Authenticates with the masked CI/CD variable
# CLAUDE_CODE_OAUTH_TOKEN, generated with `claude setup-token`.
eval-plugin-skills:
  stage: test
  image: node:22
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - plugins/ironflow/**/*
      when: manual
      allow_failure: true
  variables:
    CLAUDE_CODE_VERSION: "2.1.292"
    EVAL_MODEL: claude-sonnet-5-5
    EVAL_JUDGE_MODEL: claude-haiku-4-5-20251001
  script:
    - |
      if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
        echo "CLAUDE_CODE_OAUTH_TOKEN is not set. Generate it with 'claude setup-token' and add it"
        echo "as a masked CI/CD variable in Settings > CI/CD > Variables."
        exit 1
      fi
    - npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}
    - claude plugin eval plugins/ironflow
      --trust-plugin
      --no-publish
      --model "${EVAL_MODEL}"
      --judge-model "${EVAL_JUDGE_MODEL}"
      --threshold 0.8
      --max-cost-usd 5
      --concurrency 4
      --output-dir plugin-eval
  artifacts:
    expose_as: Plugin eval report
    paths:
      - plugin-eval/
    when: always
    expire_in: 1 week

check-openapi-types:
  extends: .only-mr-pnpm
  stage: test
  image: node:22
  needs:
    - dashboard-check
  <<: *dashboard-cache
  script:
    - pnpm generate:types
    - git diff --exit-code src/app/lib/types.generated.ts

# dashboard-build runs on MR (for cargo-check-dashboard) and main (for release-plz-release).
# On main, dashboard-check doesn't run so the need is optional.
dashboard-build:
  stage: build
  image: node:22
  needs:
    - job: dashboard-check
      optional: true
  <<: [*dashboard-cache, *pnpm-install]
  script:
    - pnpm run build
  artifacts:
    paths:
      - ironflow-dashboard/dist/
    expire_in: 1 hour

cargo-check-dashboard:
  extends: .only-mr-sccache
  stage: build
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-debug-cache
  needs:
    - dashboard-build
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - ls ironflow-dashboard/dist/
    - mkdir -p ironflow-api/dashboard
    - cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
    - ls ironflow-api/dashboard/
    - cargo check -p ironflow-api --features dashboard
    - cargo check -p ironflow-example-server

# build-release runs on main (non-release commits) to verify the release build compiles.
# Skipped on "chore: release" commits since the code is unchanged.
build-release:
  extends: .sccache
  stage: build
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-release-cache
  script:
    - cargo check --workspace --exclude ironflow-example-server --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

# release-plz-update creates the release MR. Only on regular main commits, and
# only when main passes unit-tests and postgres-tests.
release-plz-update:
  extends: .sccache
  stage: release
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-release-cache
  needs:
    - build-release
    - unit-tests
    - postgres-tests
  variables:
    GIT_DEPTH: 0
  before_script:
    - *sccache-start
    - *install-release-plz
  script:
    - git config user.name "release-plz[bot]"
    - git config user.email "release-plz@users.noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release-pr --forge gitlab --git-token "$GITLAB_TOKEN"
    - |
      MR_IID=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests?state=opened&search=release-plz&in=source_branch&per_page=1" \
        | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['iid'] if mrs else '')")
      if [ -n "$MR_IID" ]; then
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -s --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
            --data "merge_when_pipeline_succeeds=true")
          echo "$RESP"
          echo "$RESP" | grep -q '"merge_when_pipeline_succeeds":true' && break
          sleep 10
        done
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

# release-plz-release creates tags and publishes crates. Runs on all main commits
# (regular commits may have crates ready to publish, release commits always do).
# When HEAD is the merge of a release MR, release-plz checks out the last commit
# of that MR before publishing, but keeps the package paths read from HEAD. A crate
# renamed or moved on main after the release MR was opened is then missing at that
# commit ("manifest path ... does not exist"). Pushing any regular commit to main
# unblocks it: release-plz publishes from HEAD when HEAD is not a release MR merge.
release-plz-release:
  extends: .sccache
  stage: release
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  <<: *rust-release-cache
  needs:
    - job: build-release
      optional: true
    - dashboard-build
    # A broken main publishes nothing.
    - unit-tests
    - postgres-tests
  variables:
    GIT_DEPTH: 0
  before_script:
    - *sccache-start
    - *install-release-plz
    - mkdir -p ironflow-api/dashboard
    - cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
  script:
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release --forge gitlab --git-token "$GITLAB_TOKEN"
  # release-plz skips any crate whose tag already exists, so a rerun resumes at
  # the crate that failed instead of republishing. Retrying is what unblocks a
  # release that died on a crates.io timeout partway through the workspace.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Decides whether build-auth-proxy-image publishes: only when release-plz has
# tagged ironflow-auth-proxy-v<version> and the registry has no image under
# <version>. Runs on every main pipeline, so a version tagged by a later
# pipeline (a release resumed after a failure) is still published; retrying
# this job and the next one is the fallback. Not in the kaniko image: its
# busybox wget does not verify TLS certificates, and this answer decides
# whether a published tag could be overwritten.
auth-proxy-image-tag:
  stage: deploy
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  needs:
    - release-plz-release
  variables:
    GIT_DEPTH: 1
  script:
    - scripts/crate-image-tag.sh ironflow-auth-proxy/Cargo.toml "${CI_REGISTRY_IMAGE}/ironflow-auth-proxy" > auth-proxy-image.env
    - cat auth-proxy-image.env
  artifacts:
    reports:
      dotenv: auth-proxy-image.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-auth-proxy-image:
  extends: .auth-proxy-image
  stage: deploy
  needs:
    - auth-proxy-image-tag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ "${IMAGE_PUBLISH}" != "true" ]; then
        echo "Nothing to publish (IMAGE_TAG=${IMAGE_TAG}, IMAGE_PUBLISH=${IMAGE_PUBLISH}), see auth-proxy-image-tag."
        exit 0
      fi
      if [ -z "${IMAGE_TAG}" ]; then
        echo "IMAGE_PUBLISH=true without IMAGE_TAG, see auth-proxy-image-tag."
        exit 1
      fi
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/auth-proxy/Dockerfile"
      --build-arg "RUST_VERSION=${AUTH_PROXY_RUST_VERSION}"
      --destination "${CI_REGISTRY_IMAGE}/ironflow-auth-proxy:${IMAGE_TAG}"

pages:
  stage: deploy
  image: ${CI_REGISTRY_IMAGE}/ci-rust:${CI_RUST_IMAGE_TAG}
  script:
    - mdbook build
    - mv book public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
