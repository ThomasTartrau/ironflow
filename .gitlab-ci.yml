workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - build
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  IRONFLOW_FEATURES: "prometheus,openapi,sign-up,transport-docker,transport-k8s,transport-ssh"
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch

.rust-cache: &rust-cache
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

.dashboard-cache: &dashboard-cache
  cache:
    key: dashboard-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - dashboard-${CI_DEFAULT_BRANCH}
    paths:
      - ironflow-dashboard/node_modules/

cargo-fmt:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

cargo-clippy:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --exclude ironflow-example-server --features "$IRONFLOW_FEATURES" -- -D warnings

dashboard-check:
  stage: check
  image: node:22
  <<: *dashboard-cache
  script:
    - corepack enable
    - cd ironflow-dashboard && pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm tsc -b --noEmit

cargo-audit:
  stage: check
  image: rust:1.94.0
  <<: *rust-cache
  before_script:
    - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  script:
    - cargo install cargo-audit --locked
    - cargo audit
  allow_failure: false

unit-tests:
  stage: test
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - cargo-clippy
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server --features "$IRONFLOW_FEATURES"

doc-tests:
  stage: test
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - cargo-clippy
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --exclude ironflow-example-server --features "$IRONFLOW_FEATURES" --doc

check-openapi-types:
  stage: test
  image: node:22
  needs:
    - dashboard-check
  <<: *dashboard-cache
  script:
    - corepack enable
    - cd ironflow-dashboard && pnpm install --frozen-lockfile
    - pnpm generate:types
    - git diff --exit-code src/app/lib/types.generated.ts

dashboard-build:
  stage: build
  image: node:22
  needs:
    - dashboard-check
  <<: *dashboard-cache
  script:
    - corepack enable
    - cd ironflow-dashboard && pnpm install --frozen-lockfile && pnpm run build
  artifacts:
    paths:
      - ironflow-dashboard/dist/
    expire_in: 1 hour

cargo-check-dashboard:
  stage: build
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - dashboard-build
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - ls ironflow-dashboard/dist/
    - mkdir -p ironflow-api/dashboard
    - cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
    - ls ironflow-api/dashboard/
    - cargo check -p ironflow-api --features dashboard
    - cargo check -p ironflow-example-server

build-release:
  stage: build
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - unit-tests
    - doc-tests
  script:
    - cargo build --workspace --exclude ironflow-example-server --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

release-plz-update:
  stage: release
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - build-release
    - cargo-audit
  variables:
    GIT_DEPTH: 0
  before_script:
    - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
    - cargo install release-plz --locked
  script:
    - git config user.name "release-plz[bot]"
    - git config user.email "release-plz@users.noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release-pr --forge gitlab --git-token "$GITLAB_TOKEN"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release-plz-release:
  stage: release
  image: rust:1.94.0
  <<: *rust-cache
  needs:
    - build-release
    - cargo-audit
    - dashboard-build
  variables:
    GIT_DEPTH: 0
  before_script:
    - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
    - cargo install release-plz --locked
    - mkdir -p ironflow-api/dashboard
    - cp -r ironflow-dashboard/dist/. ironflow-api/dashboard/
  script:
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release --forge gitlab --git-token "$GITLAB_TOKEN"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
