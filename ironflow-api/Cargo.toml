[package]
name = "ironflow-api"
version = "2.0.1"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "REST API for ironflow run management and observability"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "api", "rest", "runs"]
categories = ["web-programming::http-server"]
include = ["src/**", "Cargo.toml", "build.rs"]

[features]
default = []
sign-up = []
dashboard = ["rust-embed", "rust-embed/interpolate-folder-path"]

[dependencies]
ironflow-store = { version = "2.0.0", path = "../ironflow-store" }
ironflow-engine = { version = "2.0.1", path = "../ironflow-engine" }
ironflow-core = { version = "2.0.1", path = "../ironflow-core" }
ironflow-auth = { version = "2.0.0", path = "../ironflow-auth" }

axum = { version = "0.8", features = ["json"] }
rust-embed = { version = "8", optional = true }
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-float"] }
subtle = "2"
tracing = "0.1"
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ironflow-store = { version = "2.0.0", path = "../ironflow-store", features = ["store-memory"] }
