[package]
name = "ironflow-auth-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Thomas Tartrau"]
license = "MIT"
description = "Auth proxy for ironflow agent pods: swaps an opaque per-step token for the real Claude credential"
repository = "https://gitlab.com/ThomasTartrau/ironflow"
keywords = ["workflow", "agent", "claude", "proxy", "kubernetes"]
categories = ["web-programming::http-server"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ironflow-auth-proxy"
path = "src/main.rs"

[dependencies]
ironflow-core = { path = "../ironflow-core", version = "4.7.0" }
ironflow-store = { path = "../ironflow-store", version = "2.39.3", features = ["store-postgres", "secret-store"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
reqwest = { version = "0.13", features = ["stream"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
